# Ambiente de TESTE (https://stamaria.cloud/teste/) — frontend e backend da branch dev,
# usando o banco stamariabd_dev (clone semanal do stamariabd, ver backend/scripts/clonar_banco_dev.sh)
# no mesmo MySQL da produção.
#
# Na VPS, a partir do checkout da branch dev (/root/projects/financeiro-web-dev):
#   git pull
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Requer o stack de produção (docker-compose.yml) rodando: o backend-dev usa a rede dele só para alcançar o "db".
# Variáveis lidas do .env deste checkout: MYSQL_DEV_PASSWORD, JWT_KEY_DEV, GEMINI_API_KEY, GEMINI_MODEL.
name: financeiro-web-dev

services:
  backend-dev:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: stamariabd_dev
      DATABASE_USER: app_dev
      DATABASE_PASSWORD: ${MYSQL_DEV_PASSWORD}
      TZ: America/Sao_Paulo
      # Chave diferente da produção: tokens de um ambiente não valem no outro.
      JWT_KEY: ${JWT_KEY_DEV}
      ENVIRONMENT: development
      # Swagger em https://stamaria.cloud/teste/docs: o "Try it out" chama /teste/api/v1 (API de teste).
      ROOT_PATH: /teste
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      # Gmail desligado no teste: evita envio de e-mails reais e callbacks OAuth caindo na produção.
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
    networks:
      teste:
        # O nginx do frontend procura "backend"; esse nome só existe na rede do teste.
        # Na rede da produção este container é apenas "backend-dev" e nunca recebe tráfego de produção.
        aliases:
          - backend
      producao: {}

  frontend-dev:
    build:
      context: ./frontend
      args:
        # Build servido em /teste/: rotas, assets e API (/teste/api/v1) passam a partir desse caminho.
        BASE_HREF: /teste/
    restart: unless-stopped
    depends_on:
      - backend-dev
    # O nginx do host encaminha https://stamaria.cloud/teste/* para cá, removendo o prefixo /teste.
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - teste

networks:
  teste: {}
  producao:
    external: true
    name: financeiro-web_default
