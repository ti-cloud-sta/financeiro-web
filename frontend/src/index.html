<!doctype html>
<html lang="pt-br">
<head>
  <!-- Codificação e compatibilidade -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">

  <!-- Identificação do documento -->
  <title>Sistemas Integrados - Santa Maria</title>
  <meta name="description" content="Sistema interno de gestão da Santa Maria: controle financeiro, plano de saúde, despesas de viagem, colaboradores e conciliação de dados.">
  <meta name="author" content="Santa Maria">
  <meta name="application-name" content="Sistemas Integrados - Santa Maria">

  <!-- Indexação: sistema interno, não deve ser indexado por buscadores -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">

  <!-- Aparência do navegador/dispositivo -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4F46E5">
  <meta name="format-detection" content="telephone=no">

  <!-- PWA / dispositivos móveis -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Santa Maria">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Ícones -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/logo-nobg.png">

  <!-- Compartilhamento (Open Graph / Twitter Card) -->
  <meta property="og:title" content="Sistemas Integrados - Santa Maria">
  <meta property="og:description" content="Sistema interno de gestão da Santa Maria: controle financeiro, plano de saúde, despesas de viagem, colaboradores e conciliação de dados.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="images/logo-nobg.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Sistemas Integrados - Santa Maria">
  <meta name="twitter:description" content="Sistema interno de gestão da Santa Maria.">
  <meta name="twitter:image" content="images/logo-nobg.png">

  <!-- Tema salvo pelo usuário (claro/escuro), aplicado antes do primeiro paint para evitar flash -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('santamaria-theme');
        const theme = saved === 'light' || saved === 'dark' ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
