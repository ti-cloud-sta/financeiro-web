@if (isOpen) {
  <div class="erp-modal-overlay" (click)="close('backdrop')">
    <div class="erp-modal-container" [ngClass]="'erp-modal--' + size" [class.erp-modal--fixed-height]="fixedHeight"
      (click)="$event.stopPropagation()">
      <div class="erp-modal-header">
        <h3 class="title">{{ title }}</h3>
        <button class="close-btn" (click)="close('x-button')">&times;</button>
      </div>
      <div class="erp-modal-body" [ngStyle]="customBodyStyle">
        <ng-content></ng-content>
      </div>
      <ng-content select="[modal-footer]"></ng-content>
    </div>
  </div>
}
