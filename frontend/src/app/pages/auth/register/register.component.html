<div class="login-wrapper">
  <div class="login-illustration">
    <div class="illustration-content">
      <h2>
        <img src="images/logo-nobg.png" style="margin-bottom: 100px; width: 400px;" alt="">
        <a href="http://localhost:4200/" style="color: inherit; text-decoration: none;">Cuidamos da sua casa, como cuidamos da nossa!</a>
      </h2>
    </div>
  </div>

  <div class="login-content">
    <div class="login-container">
      <div class="login-header d-flex align-items-center flex-column justify-content-center">
        <img src="images/logo.jpg" class="rounded-3 d-block d-sm-none mb-4" style="width: 150px;" alt="">
        <span class="text-primary h2">Sistemas Integrados</span>
        <p class="subtitle">Crie sua conta para acessar a plataforma.</p>
      </div>

      @if (errorMessage) {
        <div class="login-error-alert">
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ errorMessage }}
        </div>
      }

      @if (successMessage) {
        <div class="register-success-toast">
          <i class="fa-solid fa-circle-check"></i>
          {{ successMessage }}
        </div>
      }

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
        <app-input
          type="text"
          label="Nome Completo"
          placeholder="Seu nome completo"
          formControlName="name"
          [errorMessage]="nameError"
          icon="fa-solid fa-user">
        </app-input>

        <app-input
          type="email"
          label="Email corporativo"
          placeholder="seu@email.com"
          formControlName="email"
          [errorMessage]="emailError"
          icon="fa-regular fa-envelope">
        </app-input>

        <app-input
          type="password"
          label="Senha"
          placeholder="••••••••"
          formControlName="password"
          [errorMessage]="passwordError"
          icon="fa-solid fa-lock">
        </app-input>

        <app-input
          type="password"
          label="Confirmar Senha"
          placeholder="••••••••"
          formControlName="confirmPassword"
          [errorMessage]="confirmPasswordError"
          icon="fa-solid fa-lock">
        </app-input>

        <app-button
          variant="primary"
          size="lg"
          [loading]="isLoading"
          class="w-full">
          Criar Conta
        </app-button>
      </form>

      <div class="register-link">
        Já possui uma conta?
        <a routerLink="/login">Entrar</a>
      </div>
    </div>
  </div>
</div>
