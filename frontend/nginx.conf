server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # DNS interno do Docker. O backend-dev é resolvido a cada requisição (via variável),
    # para o nginx subir normalmente mesmo quando o ambiente dev estiver parado.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Produção: banco stamariabd
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Extrações com IA podem passar de 60s; NDJSON precisa chegar sem buffer.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Dev: backend da branch dev (docker-compose.dev.yml), banco stamariabd_dev.
    # /api-dev/v1/... é repassado como /api/v1/... para o backend-dev.
    location /api-dev/ {
        set $backend_dev http://backend-dev:8000;
        rewrite ^/api-dev/(.*)$ /api/$1 break;
        proxy_pass $backend_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
