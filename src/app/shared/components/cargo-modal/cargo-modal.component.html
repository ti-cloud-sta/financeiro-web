<app-modal [isOpen]="isOpen" title="Gerenciar Cargos" (closed)="fechar()" size="md">
  <div class="form-container py-2">
    <!-- Area do Formulário -->
    <div class="row">
      <div class="col-md-5 mb-3">
        <label class="form-label text-muted small fw-medium">NOME DO CARGO</label>
        <input type="text" class="form-control" placeholder="Ex: Analista" [(ngModel)]="novoCargo.nome">
      </div>
      <div class="col-md-7 mb-3">
        <label class="form-label text-muted small fw-medium">DESCRIÇÃO (Opcional)</label>
        <div class="d-flex gap-2">
          <input type="text" class="form-control" placeholder="Ex: Responsável por..."
            [(ngModel)]="novoCargo.descricao">
          <button class="btn btn-primary" (click)="salvarCargo()" [disabled]="!novoCargo.nome || isSalvando"
            style="white-space: nowrap;">
            <i class="fa-solid fa-spinner fa-spin me-2" *ngIf="isSalvando"></i>
            {{ isSalvando ? 'Salvando...' : (modalMode === 'create' ? 'Adicionar' : 'Alterar') }}
          </button>
          <button class="btn btn-outline-secondary" *ngIf="modalMode === 'edit'" (click)="cancelarEdicao()"
            title="Cancelar edição">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Area da Tabela -->
    <div class="mt-4 border-top pt-3">
      <h6 class="text-muted mb-3"><i class="fa-solid fa-list-ul me-2"></i> Cargos Cadastrados</h6>
      <div class="table-responsive" style="max-height: 250px; overflow-y: auto;">
        <table class="saas-table w-100">
          <thead style="position: sticky; top: 0; background: white; z-index: 1;">
            <tr>
              <th>NOME</th>
              <th>DESCRIÇÃO</th>
              <th class="text-end">AÇÕES</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let cargo of listaCargos"
              [class.bg-light]="novoCargo.idCargoColaborador === cargo.idCargoColaborador">
              <td class="fw-medium">{{ cargo.nome }}</td>
              <td class="text-muted">{{ cargo.descricao || '-' }}</td>
              <td class="text-end">
                <div class="action-buttons">
                  <button class="btn-icon" title="Editar" (click)="editarCargo(cargo)"
                    [disabled]="modalMode === 'edit'">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button class="btn-icon delete" title="Excluir"
                    (click)="confirmarExclusao(cargo.idCargoColaborador!)" [disabled]="modalMode === 'edit'">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="listaCargos.length === 0">
              <td colspan="3" class="text-center text-muted py-4">Nenhum cargo cadastrado.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="d-flex justify-content-end pt-3 mt-3 border-top">
      <app-button variant="ghost" (clicked)="fechar()">Fechar</app-button>
    </div>
  </div>
</app-modal>
