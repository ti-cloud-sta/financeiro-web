<button 
  class="btn"
  [ngClass]="getButtonClasses()"
  [disabled]="disabled || loading"
  (click)="onClick($event)">
  
  @if (loading) {
    <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
  } @else if (icon) {
    <i [class]="icon + ' me-2'"></i>
  }
  
  <span class="erp-btn-content">
    <ng-content></ng-content>
  </span>
</button>
